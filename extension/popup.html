<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Tamil Nilam Lookup</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <h1>Tamil Nilam</h1>
    <label for="lat">Latitude</label><input id="lat" type="number" step="any">
    <label for="long">Longitude</label><input id="long" type="number" step="any">
    <button id="search">Search parcel</button>
    <p id="status" role="status">Ready</p>
    <pre id="result" hidden></pre>
  </main>
  <script src="popup.js"></script>
</body>
</html>
